<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Teacher Login | GUB Smart Campus
    </title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/login.css">

</head>


<body class="login-page">


<div class="login-wrapper">


    <a href="index.html"
       class="back-link">

        ← Back to Home

    </a>


    <div class="login-box">


        <div class="login-brand">

            <div class="logo-mark">
                G
            </div>

            <div>

                <strong>
                    GUB Smart Campus
                </strong>

                <span>
                    Teacher Portal
                </span>

            </div>

        </div>



        <h1>
            Teacher Login
        </h1>


        <p class="muted">

            Sign in to manage your
            academic activities.

        </p>



        <form id="teacherLoginForm">


            <label>
                Teacher ID
            </label>

            <input
                type="text"
                id="teacherId"
                placeholder="Example: T001"
                required
            >



            <label>
                Password
            </label>

            <input
                type="password"
                id="teacherPassword"
                placeholder="Enter password"
                required
            >



            <button
                class="btn btn-primary full"
                type="submit">

                Login to Teacher Portal

            </button>


            <div
                id="teacherLoginMessage"
                class="message">
            </div>


        </form>



        <div class="demo-box">

            <strong>
                Demo Login
            </strong>

            <br>

            ID: T001

            <br>

            Password: 1234

        </div>



        <p class="switch-login">

            Student?

            <a href="student-login.html">
                Student Login
            </a>

        </p>


    </div>

</div>


<script src="js/teacher-login.js"></script>

</body>

</html>
